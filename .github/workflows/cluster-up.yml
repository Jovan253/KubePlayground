# Two responsibilities only:
#   1. Terraform creates the EKS cluster and node group.
#   2. The ingress controller is installed — cluster infrastructure, not app.
#      It owns the single load balancer everything else routes through.
#
# It does NOT deploy application code.

name: Cluster up

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2
  CLUSTER_NAME: kubeplayground
  TF_ROLE: arn:aws:iam::436535003124:role/kubeplayground-github-terraform
  DEPLOY_ROLE: arn:aws:iam::436535003124:role/kubeplayground-github-actions

jobs:
  # ---------------------------------------------------------------------------
  # 1. The cluster itself. Terraform role, gated behind the `infra` environment.
  create-cluster:
    runs-on: ubuntu-latest
    environment: infra
    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.TF_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-cluster-up

      - run: terraform init

      # ~10-15 minutes, most of it the control plane. Not hung.
      - name: Create EKS
        run: terraform apply -auto-approve -input=false -var=create_cluster=true

  # ---------------------------------------------------------------------------
  # 2. Make the cluster able to receive traffic. Deploy role — narrower, and no
  #    Terraform involved.
  ingress-controller:
    needs: create-cluster
    runs-on: ubuntu-latest

    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-ingress

      - uses: azure/setup-helm@v4

      - name: Kubeconfig
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER_NAME"

      # `upgrade --install` so re-running this workflow is harmless.
      - name: Install ingress-nginx
        run: |
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo update
          helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
            -n ingress-nginx --create-namespace --wait --timeout 10m

      - name: Report the load balancer
        run: |
          kubectl -n ingress-nginx wait --for=jsonpath='{.status.loadBalancer.ingress}' \
            svc/ingress-nginx-controller --timeout=300s
          HOST=$(kubectl -n ingress-nginx get svc ingress-nginx-controller \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          echo "Ingress load balancer: \`$HOST\`" >> "$GITHUB_STEP_SUMMARY"
          