apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeplayground-api
  namespace: kubeplayground
  labels:
    app: kubeplayground-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubeplayground-api
  template:
    metadata:
      labels:
        app: kubeplayground-api
    spec:
      serviceAccountName: kubeplayground-sa
      containers:
        - name: api
          image: kubeplayground-api:0.7.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
          resources:
            requests:
              memory: "96Mi"
              cpu: "120m"
            limits:
              memory: "160Mi"
              cpu: "700m"
