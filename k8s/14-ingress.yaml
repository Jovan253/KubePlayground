apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubeplayground
  namespace: kubeplayground
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kubeplayground-api
                port:
                  number: 80